<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima Agora</title>
  <meta name="description" content="Previsão do tempo com busca de cidades, gráfico das próximas 24 horas e previsão da semana.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='6' fill='%23fbbf24'/></svg>">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-ceu="ensolarado">
  <div class="pagina">
    <header class="topo">
      <a class="marca" href="./">Clima<span>Agora</span></a>

      <form class="busca" id="form-busca" role="search" autocomplete="off">
        <label class="sr" for="campo-busca">Buscar cidade</label>
        <span class="busca-icone" id="icone-busca"></span>
        <input id="campo-busca" type="search" placeholder="Buscar cidade…" aria-autocomplete="list" aria-controls="sugestoes" aria-expanded="false">
        <ul class="sugestoes" id="sugestoes" role="listbox" hidden></ul>
      </form>

      <div class="acoes-topo">
        <button class="botao-icone" id="btn-local" type="button" title="Usar minha localização" aria-label="Usar minha localização"></button>
        <button class="botao-unidade" id="btn-unidade" type="button" aria-label="Trocar unidade de temperatura">°C</button>
      </div>
    </header>

    <nav class="favoritos" id="favoritos" aria-label="Cidades favoritas"></nav>

    <main id="conteudo" aria-live="polite">
      <!-- preenchido pelo JavaScript -->
    </main>

    <footer class="rodape">
      Dados de <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
      Feito por <a href="https://github.com/GabrielEvaristo77" target="_blank" rel="noopener">Gabriel Evaristo</a>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
